name: Code Quality (Lint)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] # Runs on every PR to prevent merging "dirty" code

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute ESLint
        run: npm run lint # Uses your local config (Standard, no-semi, single-quotes)
